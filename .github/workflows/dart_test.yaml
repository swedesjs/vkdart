name: Проверка и публикация vkdart 🚀

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Проверки 🧪
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Получить исходный код 📥
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Установить Dart 🧩
        uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603
        with:
          sdk: stable

      - name: Кэшировать зависимости Pub 📦
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Установить зависимости 📥
        run: dart pub get

      - name: Проверить версию тега 🏷️
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Тег v${package_version} должен совпадать с версией в pubspec.yaml."
            exit 1
          fi

      - name: Проверить код 🔎
        run: dart analyze

      - name: Запустить тесты 🧪
        run: dart test

  publish:
    name: Публикация на pub.dev 🚀
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      use-flutter: false
