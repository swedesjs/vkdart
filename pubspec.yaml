name: vkdart
description: Пакет упрощает работу с VK API.
  Предоставляет удобный доступ к методам VK, поддерживает события и многое другое.
version: 2.3.3
repository: https://github.com/swedesjs/vkdart
issue_tracker: https://github.com/swedesjs/vkdart/issues

topics:
  - dart
  - vkontakte
  - vk-api
  - long-poll
  - callback-api

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  build_runner: ^2.17.1
  json_serializable: ^6.15.2
  lints: ^2.0.0
  shouldly: ^0.5.0+1
  test: ^1.16.0

dependencies: { http: ^1.2.0, json_annotation: ^4.12.0, meta: ^1.19.0 }
