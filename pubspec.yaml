name: vkdart
description: Пакет упрощает работу с VK API.
  Предоставляет удобный доступ к методам VK, поддерживает события и многое другое.
version: 2.3.2
repository: https://github.com/swedests/vkdart
issue_tracker: https://github.com/swedests/vkdart/issues

topics:
  - vkontakte
  - vk
  - api
  - vk-api
  - http

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  lints: ^2.0.0
  shouldly: ^0.5.0+1
  test: ^1.16.0

dependencies: { http: ^1.2.0 }
